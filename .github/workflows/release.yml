name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RELEASEBOX_REF: v0.1.0

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.5.1
      - name: Install dependencies
        run: npm ci
      - name: Install ReleaseBox
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$RELEASEBOX_REF" https://github.com/rogerchappel/releasebox.git /tmp/releasebox
          npm --prefix /tmp/releasebox ci
          npm --prefix /tmp/releasebox run build
      - name: ReleaseBox readiness check
        run: node /tmp/releasebox/bin/releasebox.js check .
      - name: Verify release tag matches package version
        run: npm run release:tag-check -- "${GITHUB_REF_NAME}"
      - name: Run release checks
        run: npm run release:check
      - name: Pack release artifact
        id: pack
        run: |
          set -euo pipefail
          package_file="$(npm pack --json | node -e '
            let input = "";
            process.stdin.on("data", chunk => input += chunk);
            process.stdin.on("end", () => {
              const result = JSON.parse(input);
              if (result.length !== 1 || !result[0].filename) process.exit(1);
              process.stdout.write(result[0].filename);
            });
          ')"
          test -f "$package_file"
          echo "package_file=$package_file" >> "$GITHUB_OUTPUT"
      - name: Publish package to npm
        run: npm publish "${{ steps.pack.outputs.package_file }}" --access public --provenance
      - name: Generate release notes
        run: node /tmp/releasebox/bin/releasebox.js notes . > RELEASE_NOTES.md
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          --notes-file RELEASE_NOTES.md
          "${{ steps.pack.outputs.package_file }}"
